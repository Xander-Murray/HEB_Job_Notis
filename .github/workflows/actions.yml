name: heb job alerts

on:
  schedule:
    # Every 2 hours, on the hour (UTC). GitHub may start scheduled runs late.
    - cron: "0 */2 * * *"
  workflow_dispatch:

# The job commits seen.json back to the repo.
permissions:
  contents: write

# Never run two checks at once (they'd race on seen.json).
concurrency:
  group: heb-alerts-v2
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: run tests
        run: cargo test --release

      - name: check for new jobs
        env:
          EMAIL_ID: ${{ secrets.EMAIL_ID }}
          EMAIL_PWORD: ${{ secrets.EMAIL_PWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: cargo run --release

      - name: save seen.json
        run: |
          if git diff --quiet seen.json; then
            echo "seen.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: update seen jobs"
          # Rebase in case someone pushed while this run was going.
          git pull --rebase
          git push
